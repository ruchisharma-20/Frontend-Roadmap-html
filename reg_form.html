<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Html Form</title>
</head>
<body>
  <h1>Html Form</h1>
  <h2>Login Form</h2>
  <form method="post" action="/">
    <p>
    <div><label for="name">Name:</label></div>

    <input type="text" id="name" placeholder="Name" name="name">
</p>
    <p><div><label for="pwd">Password:</label></div>
        <input type="password" id="pwd" placeholder="Passowrd" name="pwd"></p>
        <p><div><label for="email">Email: </label></div>

            <input type="email" id="email" placeholder="Email Id" name="email"></p>
           <p> <div> <input type="reset" name="reset">&nbsp;<input type="submit" name="submit"></div></p>
               



  </form>
</body>
</html>
